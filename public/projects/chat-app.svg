<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Chat Application">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="rgba(255,255,255,0.12)"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <text x="400" y="215" font-family="system-ui, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">Chat Application</text>
  <text x="400" y="260" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.85)" text-anchor="middle">Real-time messaging</text>
</svg>
